# Minimal code-hygiene hooks, trimmed to what applies to a static site, not a Gradle/Java build.
# Run with `prek` or `pre-commit`.
#
# `prek install` (and `pre-commit install`) wire only the pre-commit hook type unless told
# otherwise, which would leave the commit-msg hook below installed but never invoked.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # Config lives in .prettierrc.json, not flags here. printWidth there MUST match MD013's own
      # line_length in .markdownlint-cli2.jsonc - change one, change both.
      #
      # embeddedLanguageFormatting: "off" is load-bearing, not cosmetic: Prettier's default
      # ("auto") tries to reformat recognised-language content INSIDE fenced code blocks too,
      # which corrupts a YAML flow-mapping followed by a trailing `#` comment
      # (`key: { ... }  # comment`) - dropped keys, emptied `{ }` blocks.
      - id: prettier-markdown
        name: Prettier (auto-format Markdown)
        language: system
        entry: npx --yes prettier@3.9.6 --write
        pass_filenames: true
        types: [markdown]

  # Structural rules Prettier doesn't check at all (MD024 duplicate headings, MD032 list spacing,
  # MD060 table style, and the rest of the enabled default rule set). MD013 (line length) has no
  # auto-fix in any markdownlint implementation, so this only catches a >100-column line;
  # Prettier's own proseWrap: "always" is what actually fixes it.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # gitleaks-system, not the default gitleaks, which builds the binary from source with Go on
  # first run: that produces an unsigned, reputation-less executable in AppData, which Windows
  # Smart App Control blocks outright (os error 4551). Needs gitleaks on PATH (`scoop install
  # gitleaks`, `brew install gitleaks`, or a release binary).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # `gitleaks git --staged` reads the staged diff itself and takes at most one path, so
        # passing it the changed filenames makes it exit with "accepts at most 1 arg(s)".
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # This repo deliberately uses the British spelling (LICENCE) - a near miss with LICENSE that
      # would collide silently on Windows/macOS's case-insensitive filesystems.
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      # .gitattributes already pins eol=lf; this guards against that being weakened rather than
      # being the fix for it.
      - id: mixed-line-ending
        args: [--fix=lf]

  # Link rot, on demand only: `prek run --hook-stage manual lychee` (or `pre-commit run
  # --hook-stage manual lychee`). Deliberately NOT on commit - external hosts fail for reasons
  # unrelated to the change under review, and a hook that blocks a commit because someone else's
  # server is down is a hook that gets bypassed. `.github/workflows/link-check.yml` runs the same
  # flags nightly, scoped to docs/.
  #
  # --method get, not the default HEAD: some hosts answer HEAD with an error and GET with 200.
  # Needs lychee on PATH (`scoop install lychee`, `brew install lychee`, or a release binary).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # Conventional Commits, on the commit-msg stage. Python rather than the Node commitlint hook: no
  # config file, no additional_dependencies, and nothing compiled - matters on Windows, where
  # Smart App Control blocks locally built binaries.
  #
  # No `args:` - left at the hook's own built-in default type list (build, chore, ci, docs, feat,
  # fix, perf, refactor, revert, style, test), shared across every pre-commit-managed repo in this
  # workspace rather than a repo-specific subset: one fewer list to keep in sync.
  #
  # This checks the *shape* of a subject, not whether the type is the right one, and accepts
  # `Feat:` - there is no case-sensitivity option, and --strict only blocks fixup and merge commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
