# Nightly link sweep. Same flags as the local `lychee-system` pre-commit hook's manual stage
# (.pre-commit-config.yaml) - --method get, not the default HEAD, for the same reason recorded
# there. Scoped to docs/ - the only place this repo's Markdown lives (VitePress content; the
# generated docs/.vitepress/dist/ and docs/.vitepress/cache/ aren't Markdown, so the glob doesn't
# need to exclude them). Same pattern as identigon/identigon's, play-bazlang's, and doc-kit's own
# link-check.yml.
name: "Link check"

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  lychee:
    name: "lychee"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --method get --max-concurrency 4 "docs/**/*.md"
          fail: true
